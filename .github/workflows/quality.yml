name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:regression
      - run: npm test
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL 16 binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_ctl ]; then
            sudo apt-get update && sudo apt-get install -y postgresql-16
          fi
      - run: PGBIN=/usr/lib/postgresql/16/bin ./scripts/db-test.sh
      - run: PGBIN=/usr/lib/postgresql/16/bin ./scripts/db-rollback-test.sh
